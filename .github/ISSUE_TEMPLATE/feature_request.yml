name: Feature request
description: Something you would like Beam Planner to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Issues here are public, so you can see what others have already asked for.
        If your request is already open, add a comment there instead of opening a new one.

  - type: textarea
    id: what
    attributes:
      label: What would you like to do
      description: Describe the task, not only the control you have in mind.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How you handle it today
      description: What you do now instead, and where that falls short.
    validations:
      required: false
